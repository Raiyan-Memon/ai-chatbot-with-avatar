<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#bg)"/>
  <rect width="32" height="16" rx="9" fill="url(#shine)"/>

  <text
    x="16"
    y="17"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="700"
    fill="#ffffff"
  >RM</text>

  <!-- A small spark to signal "AI-assisted", not just a plain monogram. -->
  <circle cx="25.5" cy="7.5" r="3" fill="#22d3ee" stroke="#ffffff" stroke-width="1"/>
</svg>
